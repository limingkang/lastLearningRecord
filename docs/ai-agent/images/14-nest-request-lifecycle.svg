<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">NestJS 请求生命周期</title>
  <desc id="desc">展示请求经过 Middleware、Guard、Interceptor、Pipe、Controller、Service、Repository、Exception Filter 和 Response 的流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #0f172a; }
      .box { stroke-width: 2; rx: 14; }
      .entry { fill: #eff6ff; stroke: #3b82f6; }
      .guard { fill: #fff7ed; stroke: #f97316; }
      .app { fill: #ecfdf5; stroke: #10b981; }
      .data { fill: #fef3c7; stroke: #f59e0b; }
      .err { fill: #fef2f2; stroke: #ef4444; }
      .head { font: 700 16px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #0f172a; }
      .small { font: 13px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #334155; }
      .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #ef4444; stroke-width: 2; stroke-dasharray: 6 6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1200" height="520"/>
  <text class="title" x="600" y="52" text-anchor="middle">NestJS 请求生命周期：每一层只做自己的事</text>

  <rect class="box entry" x="35" y="185" width="115" height="70"/>
  <text class="head" x="92" y="214" text-anchor="middle">Request</text>
  <text class="small" x="92" y="237" text-anchor="middle">HTTP 请求</text>

  <rect class="box entry" x="185" y="185" width="125" height="70"/>
  <text class="head" x="247" y="214" text-anchor="middle">Middleware</text>
  <text class="small" x="247" y="237" text-anchor="middle">traceId / 日志</text>

  <rect class="box guard" x="345" y="185" width="105" height="70"/>
  <text class="head" x="397" y="214" text-anchor="middle">Guard</text>
  <text class="small" x="397" y="237" text-anchor="middle">鉴权</text>

  <rect class="box guard" x="485" y="185" width="125" height="70"/>
  <text class="head" x="547" y="214" text-anchor="middle">Interceptor</text>
  <text class="small" x="547" y="237" text-anchor="middle">前后处理</text>

  <rect class="box guard" x="645" y="185" width="95" height="70"/>
  <text class="head" x="692" y="214" text-anchor="middle">Pipe</text>
  <text class="small" x="692" y="237" text-anchor="middle">校验 DTO</text>

  <rect class="box app" x="775" y="185" width="125" height="70"/>
  <text class="head" x="837" y="214" text-anchor="middle">Controller</text>
  <text class="small" x="837" y="237" text-anchor="middle">请求入口</text>

  <rect class="box app" x="935" y="185" width="105" height="70"/>
  <text class="head" x="987" y="214" text-anchor="middle">Service</text>
  <text class="small" x="987" y="237" text-anchor="middle">业务逻辑</text>

  <rect class="box data" x="1075" y="185" width="100" height="70"/>
  <text class="head" x="1125" y="214" text-anchor="middle">Repo</text>
  <text class="small" x="1125" y="237" text-anchor="middle">数据库</text>

  <line class="arrow" x1="150" y1="220" x2="182" y2="220"/>
  <line class="arrow" x1="310" y1="220" x2="342" y2="220"/>
  <line class="arrow" x1="450" y1="220" x2="482" y2="220"/>
  <line class="arrow" x1="610" y1="220" x2="642" y2="220"/>
  <line class="arrow" x1="740" y1="220" x2="772" y2="220"/>
  <line class="arrow" x1="900" y1="220" x2="932" y2="220"/>
  <line class="arrow" x1="1040" y1="220" x2="1072" y2="220"/>

  <rect class="box err" x="430" y="340" width="340" height="70"/>
  <text class="head" x="600" y="369" text-anchor="middle">Exception Filter</text>
  <text class="small" x="600" y="392" text-anchor="middle">统一异常格式，隐藏内部错误细节</text>

  <path class="dash" d="M397 255 C420 310, 485 330, 520 338"/>
  <path class="dash" d="M837 255 C810 310, 720 330, 680 338"/>
  <path class="dash" d="M987 255 C930 320, 760 340, 700 340"/>

  <rect class="box entry" x="510" y="80" width="180" height="60"/>
  <text class="head" x="600" y="116" text-anchor="middle">Response</text>
  <path class="arrow" d="M1125 185 C1060 85, 780 70, 690 110"/>
  <text class="small" x="770" y="94">成功响应沿调用链返回</text>
</svg>
