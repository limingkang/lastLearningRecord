<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="760" viewBox="0 0 1220 760" role="img" aria-labelledby="title desc">
  <title id="title">第四阶段 RAG 学习地图</title>
  <desc id="desc">展示 RAG 知识库开发需要学习的文档解析、切分、Embedding、向量数据库、检索、回答生成、引用、权限和评估。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#475569"/></marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 30px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#0f172a}.sub{font:15px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#64748b}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:14}.root{fill:#dbeafe;stroke:#2563eb}.a{fill:#eff6ff;stroke:#3b82f6}.b{fill:#ecfdf5;stroke:#10b981}.c{fill:#fef3c7;stroke:#f59e0b}.d{fill:#f5f3ff;stroke:#8b5cf6}.e{fill:#fff7ed;stroke:#f97316}.f{fill:#fce7f3;stroke:#ec4899}
      .head{font:700 18px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#0f172a}.small{font:14px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#334155}.arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1220" height="760"/>
  <text class="title" x="610" y="50" text-anchor="middle">第四阶段学习地图：RAG 知识库开发</text>
  <text class="sub" x="610" y="78" text-anchor="middle">目标是做出能上传文档、建立索引、检索回答、带引用、可评估的个人知识库助手</text>

  <rect class="card root" x="485" y="115" width="250" height="78"/>
  <text class="head" x="610" y="148" text-anchor="middle">RAG 知识库系统</text>
  <text class="small" x="610" y="172" text-anchor="middle">检索增强生成</text>

  <rect class="card a" x="70" y="285" width="170" height="125"/><text class="head" x="155" y="318" text-anchor="middle">文档解析</text><text class="small" x="110" y="348">PDF / MD / TXT</text><text class="small" x="110" y="374">标题 / 页码</text><text class="small" x="110" y="400">清洗文本</text>
  <rect class="card b" x="285" y="285" width="170" height="125"/><text class="head" x="370" y="318" text-anchor="middle">Chunk 切分</text><text class="small" x="325" y="348">size / overlap</text><text class="small" x="325" y="374">标题 / 段落</text><text class="small" x="325" y="400">metadata</text>
  <rect class="card c" x="500" y="285" width="170" height="125"/><text class="head" x="585" y="318" text-anchor="middle">Embedding</text><text class="small" x="540" y="348">文本转向量</text><text class="small" x="540" y="374">维度 / 成本</text><text class="small" x="540" y="400">批量入库</text>
  <rect class="card d" x="715" y="285" width="170" height="125"/><text class="head" x="800" y="318" text-anchor="middle">向量检索</text><text class="small" x="755" y="348">topK</text><text class="small" x="755" y="374">metadata 过滤</text><text class="small" x="755" y="400">hybrid / rerank</text>
  <rect class="card e" x="930" y="285" width="170" height="125"/><text class="head" x="1015" y="318" text-anchor="middle">回答生成</text><text class="small" x="970" y="348">拼 Prompt</text><text class="small" x="970" y="374">引用来源</text><text class="small" x="970" y="400">拒答策略</text>

  <rect class="card f" x="255" y="535" width="310" height="105"/><text class="head" x="410" y="568" text-anchor="middle">权限和安全</text><text class="small" x="305" y="598">用户隔离、文件权限、敏感信息、prompt injection</text>
  <rect class="card f" x="655" y="535" width="310" height="105"/><text class="head" x="810" y="568" text-anchor="middle">质量评估</text><text class="small" x="705" y="598">召回率、引用正确率、拒答正确率、bad case</text>

  <line class="arrow" x1="525" y1="193" x2="155" y2="282"/><line class="arrow" x1="570" y1="193" x2="370" y2="282"/><line class="arrow" x1="610" y1="193" x2="585" y2="282"/><line class="arrow" x1="650" y1="193" x2="800" y2="282"/><line class="arrow" x1="695" y1="193" x2="1015" y2="282"/>
  <line class="arrow" x1="370" y1="410" x2="410" y2="532"/><line class="arrow" x1="800" y1="410" x2="810" y2="532"/>
</svg>
