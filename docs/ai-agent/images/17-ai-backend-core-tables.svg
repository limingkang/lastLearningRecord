<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc">
  <title id="title">AI 服务端核心数据表</title>
  <desc id="desc">展示用户、会话、消息、文件、任务、模型调用、工具调用、文档和 chunk 等核心表之间的关系。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#475569"/></marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #0f172a; }
      .table { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 12; }
      .headbar { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .head { font: 700 16px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #0f172a; }
      .field { font: 13px "Consolas", "Microsoft YaHei", monospace; fill: #334155; }
      .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1240" height="760"/>
  <text class="title" x="620" y="52" text-anchor="middle">AI 服务端核心数据表设计</text>

  <g transform="translate(70,110)">
    <rect class="table" width="190" height="145"/><rect class="headbar" width="190" height="38" rx="12"/>
    <text class="head" x="95" y="25" text-anchor="middle">users</text>
    <text class="field" x="18" y="62">id</text><text class="field" x="18" y="86">email</text><text class="field" x="18" y="110">password_hash</text><text class="field" x="18" y="134">created_at</text>
  </g>
  <g transform="translate(340,110)">
    <rect class="table" width="190" height="145"/><rect class="headbar" width="190" height="38" rx="12"/>
    <text class="head" x="95" y="25" text-anchor="middle">sessions</text>
    <text class="field" x="18" y="62">id</text><text class="field" x="18" y="86">user_id</text><text class="field" x="18" y="110">title</text><text class="field" x="18" y="134">created_at</text>
  </g>
  <g transform="translate(610,110)">
    <rect class="table" width="190" height="165"/><rect class="headbar" width="190" height="38" rx="12"/>
    <text class="head" x="95" y="25" text-anchor="middle">messages</text>
    <text class="field" x="18" y="62">id</text><text class="field" x="18" y="86">session_id</text><text class="field" x="18" y="110">role</text><text class="field" x="18" y="134">content</text><text class="field" x="18" y="158">metadata</text>
  </g>
  <g transform="translate(880,110)">
    <rect class="table" width="220" height="165"/><rect class="headbar" width="220" height="38" rx="12"/>
    <text class="head" x="110" y="25" text-anchor="middle">model_calls</text>
    <text class="field" x="18" y="62">id</text><text class="field" x="18" y="86">user_id / session_id</text><text class="field" x="18" y="110">model</text><text class="field" x="18" y="134">tokens / cost</text><text class="field" x="18" y="158">latency / error</text>
  </g>

  <g transform="translate(70,390)">
    <rect class="table" width="210" height="165"/><rect class="headbar" width="210" height="38" rx="12"/>
    <text class="head" x="105" y="25" text-anchor="middle">files</text>
    <text class="field" x="18" y="62">id</text><text class="field" x="18" y="86">user_id</text><text class="field" x="18" y="110">name / mime_type</text><text class="field" x="18" y="134">storage_path</text><text class="field" x="18" y="158">status</text>
  </g>
  <g transform="translate(350,390)">
    <rect class="table" width="210" height="165"/><rect class="headbar" width="210" height="38" rx="12"/>
    <text class="head" x="105" y="25" text-anchor="middle">documents</text>
    <text class="field" x="18" y="62">id</text><text class="field" x="18" y="86">file_id</text><text class="field" x="18" y="110">title</text><text class="field" x="18" y="134">parse_status</text><text class="field" x="18" y="158">metadata</text>
  </g>
  <g transform="translate(630,390)">
    <rect class="table" width="210" height="165"/><rect class="headbar" width="210" height="38" rx="12"/>
    <text class="head" x="105" y="25" text-anchor="middle">chunks</text>
    <text class="field" x="18" y="62">id</text><text class="field" x="18" y="86">document_id</text><text class="field" x="18" y="110">content</text><text class="field" x="18" y="134">embedding</text><text class="field" x="18" y="158">metadata</text>
  </g>
  <g transform="translate(910,390)">
    <rect class="table" width="220" height="165"/><rect class="headbar" width="220" height="38" rx="12"/>
    <text class="head" x="110" y="25" text-anchor="middle">tasks / tool_calls</text>
    <text class="field" x="18" y="62">id</text><text class="field" x="18" y="86">type / status</text><text class="field" x="18" y="110">input / output</text><text class="field" x="18" y="134">error</text><text class="field" x="18" y="158">trace_id</text>
  </g>

  <line class="arrow" x1="260" y1="180" x2="337" y2="180"/>
  <line class="arrow" x1="530" y1="180" x2="607" y2="180"/>
  <line class="arrow" x1="800" y1="190" x2="877" y2="190"/>
  <line class="arrow" x1="260" y1="475" x2="347" y2="475"/>
  <line class="arrow" x1="560" y1="475" x2="627" y2="475"/>
  <line class="arrow" x1="840" y1="475" x2="907" y2="475"/>
  <path class="arrow" d="M165 255 C160 310, 160 340, 175 387"/>
  <path class="arrow" d="M435 255 C480 310, 820 310, 990 387"/>
</svg>
