<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc">
  <title id="title">RAG 系统架构</title>
  <desc id="desc">展示 Vue、NestJS、FastAPI、PostgreSQL、pgvector、Redis 队列、LLM Provider 在 RAG 知识库系统中的协作。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#475569"/></marker>
    <style>.bg{fill:#f8fafc}.title{font:700 30px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#0f172a}.box{stroke-width:2;rx:14}.fe{fill:#eff6ff;stroke:#3b82f6}.api{fill:#ecfdf5;stroke:#10b981}.ai{fill:#f5f3ff;stroke:#8b5cf6}.data{fill:#fef3c7;stroke:#f59e0b}.obs{fill:#fff7ed;stroke:#f97316}.head{font:700 17px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#0f172a}.small{font:14px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#334155}.arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect class="bg" width="1240" height="760"/><text class="title" x="620" y="52" text-anchor="middle">个人知识库 RAG 助手架构</text>
  <rect class="box fe" x="70" y="120" width="170" height="95"/><text class="head" x="155" y="155" text-anchor="middle">Vue 前端</text><text class="small" x="155" y="180" text-anchor="middle">上传 / 提问</text><text class="small" x="155" y="202" text-anchor="middle">引用展示</text>
  <rect class="box api" x="340" y="95" width="230" height="270"/><text class="head" x="455" y="130" text-anchor="middle">NestJS 主后端</text><text class="small" x="385" y="170">用户 / 权限</text><text class="small" x="385" y="200">文件 / 文档 / 任务</text><text class="small" x="385" y="230">RAG Answer Service</text><text class="small" x="385" y="260">LLM Provider</text><text class="small" x="385" y="290">日志 / 成本 / trace</text><text class="small" x="385" y="320">调用 FastAPI</text>
  <rect class="box ai" x="700" y="95" width="230" height="270"/><text class="head" x="815" y="130" text-anchor="middle">FastAPI AI 服务</text><text class="small" x="745" y="170">文档解析</text><text class="small" x="745" y="200">文本切分</text><text class="small" x="745" y="230">Embedding</text><text class="small" x="745" y="260">检索 / Rerank</text><text class="small" x="745" y="290">RAG 评估</text>
  <rect class="box data" x="1010" y="115" width="170" height="90"/><text class="head" x="1095" y="150" text-anchor="middle">PostgreSQL</text><text class="small" x="1095" y="175" text-anchor="middle">用户 / 文档 / 任务</text>
  <rect class="box data" x="1010" y="245" width="170" height="90"/><text class="head" x="1095" y="280" text-anchor="middle">pgvector</text><text class="small" x="1095" y="305" text-anchor="middle">chunks + embedding</text>
  <rect class="box data" x="355" y="480" width="180" height="90"/><text class="head" x="445" y="515" text-anchor="middle">Redis / BullMQ</text><text class="small" x="445" y="540" text-anchor="middle">索引任务队列</text>
  <rect class="box obs" x="640" y="480" width="230" height="90"/><text class="head" x="755" y="515" text-anchor="middle">Logs / Eval</text><text class="small" x="755" y="540" text-anchor="middle">召回、引用、成本、bad case</text>
  <line class="arrow" x1="240" y1="165" x2="337" y2="165"/><line class="arrow" x1="570" y1="230" x2="697" y2="230"/><line class="arrow" x1="930" y1="160" x2="1007" y2="160"/><line class="arrow" x1="930" y1="285" x2="1007" y2="285"/><line class="arrow" x1="455" y1="365" x2="445" y2="477"/><line class="arrow" x1="700" y1="335" x2="755" y2="477"/><path class="arrow" d="M700 250 C640 330, 585 345, 570 305"/>
  <rect class="box" x="230" y="635" width="780" height="65" fill="#fff" stroke="#cbd5e1"/><text class="small" x="620" y="674" text-anchor="middle">原则：前端只调 NestJS；权限和任务状态在 NestJS；解析、embedding、检索可放 FastAPI；向量和 metadata 必须能追溯来源。</text>
</svg>
