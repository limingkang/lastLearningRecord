<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" role="img" aria-labelledby="title desc">
  <title id="title">RAG 建库流水线</title>
  <desc id="desc">展示从文件上传到解析、清洗、切分、生成 embedding、写入 chunks 表和更新任务状态的完整建库流程。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#475569"/></marker>
    <style>.bg{fill:#f8fafc}.title{font:700 30px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#0f172a}.box{stroke-width:2;rx:14}.a{fill:#eff6ff;stroke:#3b82f6}.b{fill:#ecfdf5;stroke:#10b981}.c{fill:#fef3c7;stroke:#f59e0b}.d{fill:#f5f3ff;stroke:#8b5cf6}.e{fill:#fff7ed;stroke:#f97316}.head{font:700 16px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#0f172a}.small{font:13px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#334155}.arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect class="bg" width="1240" height="560"/><text class="title" x="620" y="52" text-anchor="middle">RAG 建库流水线：上传文档到可检索索引</text>
  <rect class="box a" x="40" y="190" width="125" height="75"/><text class="head" x="102" y="220" text-anchor="middle">上传文件</text><text class="small" x="102" y="244" text-anchor="middle">保存 file</text>
  <rect class="box b" x="215" y="190" width="125" height="75"/><text class="head" x="277" y="220" text-anchor="middle">创建任务</text><text class="small" x="277" y="244" text-anchor="middle">taskId</text>
  <rect class="box b" x="390" y="190" width="125" height="75"/><text class="head" x="452" y="220" text-anchor="middle">解析文本</text><text class="small" x="452" y="244" text-anchor="middle">标题 / 页码</text>
  <rect class="box c" x="565" y="190" width="125" height="75"/><text class="head" x="627" y="220" text-anchor="middle">清洗文本</text><text class="small" x="627" y="244" text-anchor="middle">去噪</text>
  <rect class="box c" x="740" y="190" width="125" height="75"/><text class="head" x="802" y="220" text-anchor="middle">切分 Chunk</text><text class="small" x="802" y="244" text-anchor="middle">metadata</text>
  <rect class="box d" x="915" y="190" width="125" height="75"/><text class="head" x="977" y="220" text-anchor="middle">Embedding</text><text class="small" x="977" y="244" text-anchor="middle">批量向量</text>
  <rect class="box e" x="1090" y="190" width="125" height="75"/><text class="head" x="1152" y="220" text-anchor="middle">写入索引</text><text class="small" x="1152" y="244" text-anchor="middle">pgvector</text>
  <line class="arrow" x1="165" y1="227" x2="212" y2="227"/><line class="arrow" x1="340" y1="227" x2="387" y2="227"/><line class="arrow" x1="515" y1="227" x2="562" y2="227"/><line class="arrow" x1="690" y1="227" x2="737" y2="227"/><line class="arrow" x1="865" y1="227" x2="912" y2="227"/><line class="arrow" x1="1040" y1="227" x2="1087" y2="227"/>
  <rect class="box" x="220" y="360" width="800" height="78" fill="#fff" stroke="#cbd5e1"/><text class="head" x="620" y="392" text-anchor="middle">建库任务必须可追踪</text><text class="small" x="620" y="418" text-anchor="middle">记录 parse_status、chunk_count、embedding_status、error_message、retry_count、started_at、finished_at。</text>
</svg>
