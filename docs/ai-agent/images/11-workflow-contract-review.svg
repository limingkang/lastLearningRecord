<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" role="img" aria-labelledby="title desc">
  <title id="title">Workflow 示例：合同风险审查</title>
  <desc id="desc">合同审查流程按上传、解析、提取信息、检查风险、生成报告、人工确认、导出 PDF 的固定步骤执行。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #0f172a; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 14; }
      .program { fill: #eff6ff; stroke: #3b82f6; }
      .llm { fill: #f5f3ff; stroke: #8b5cf6; }
      .human { fill: #fff7ed; stroke: #f97316; }
      .head { font: 700 16px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #0f172a; }
      .small { font: 13px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #334155; }
      .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1120" height="450"/>
  <text class="title" x="560" y="52" text-anchor="middle">Workflow 示例：合同风险审查</text>

  <rect class="box program" x="45" y="170" width="125" height="70"/>
  <text class="head" x="107" y="200" text-anchor="middle">上传合同</text>
  <text class="small" x="107" y="223" text-anchor="middle">程序逻辑</text>

  <rect class="box program" x="205" y="170" width="125" height="70"/>
  <text class="head" x="267" y="200" text-anchor="middle">解析文本</text>
  <text class="small" x="267" y="223" text-anchor="middle">文档服务</text>

  <rect class="box llm" x="365" y="170" width="125" height="70"/>
  <text class="head" x="427" y="200" text-anchor="middle">提取信息</text>
  <text class="small" x="427" y="223" text-anchor="middle">LLM 节点</text>

  <rect class="box llm" x="525" y="170" width="125" height="70"/>
  <text class="head" x="587" y="200" text-anchor="middle">检查风险</text>
  <text class="small" x="587" y="223" text-anchor="middle">规则 + LLM</text>

  <rect class="box llm" x="685" y="170" width="125" height="70"/>
  <text class="head" x="747" y="200" text-anchor="middle">生成报告</text>
  <text class="small" x="747" y="223" text-anchor="middle">结构化输出</text>

  <rect class="box human" x="845" y="170" width="125" height="70"/>
  <text class="head" x="907" y="200" text-anchor="middle">人工确认</text>
  <text class="small" x="907" y="223" text-anchor="middle">高风险复核</text>

  <rect class="box program" x="1005" y="170" width="90" height="70"/>
  <text class="head" x="1050" y="200" text-anchor="middle">导出</text>
  <text class="small" x="1050" y="223" text-anchor="middle">PDF</text>

  <line class="arrow" x1="170" y1="205" x2="202" y2="205"/>
  <line class="arrow" x1="330" y1="205" x2="362" y2="205"/>
  <line class="arrow" x1="490" y1="205" x2="522" y2="205"/>
  <line class="arrow" x1="650" y1="205" x2="682" y2="205"/>
  <line class="arrow" x1="810" y1="205" x2="842" y2="205"/>
  <line class="arrow" x1="970" y1="205" x2="1002" y2="205"/>

  <rect class="box" x="190" y="315" width="740" height="70"/>
  <text class="head" x="560" y="344" text-anchor="middle">为什么这里适合 Workflow？</text>
  <text class="small" x="560" y="368" text-anchor="middle">步骤固定、可测试、可恢复；模型只负责某些智能节点，外层流程由程序控制。</text>
</svg>
