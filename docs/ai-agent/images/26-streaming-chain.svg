<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="540" viewBox="0 0 1180 540" role="img" aria-labelledby="title desc">
  <title id="title">LLM 流式输出链路</title>
  <desc id="desc">后端调用模型流，接收 delta token，并通过 SSE 返回前端，最后保存完整消息和 usage。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#475569"/></marker>
    <style>
      .bg { fill:#f8fafc; }
      .title { font:700 30px "Microsoft YaHei","PingFang SC",Arial,sans-serif; fill:#0f172a; }
      .box { stroke-width:2; rx:14; }
      .fe { fill:#eff6ff; stroke:#3b82f6; }
      .api { fill:#ecfdf5; stroke:#10b981; }
      .llm { fill:#f5f3ff; stroke:#8b5cf6; }
      .log { fill:#fff7ed; stroke:#f97316; }
      .head { font:700 17px "Microsoft YaHei","PingFang SC",Arial,sans-serif; fill:#0f172a; }
      .small { font:14px "Microsoft YaHei","PingFang SC",Arial,sans-serif; fill:#334155; }
      .arrow { stroke:#475569; stroke-width:2; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#64748b; stroke-width:2; stroke-dasharray:6 6; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1180" height="540"/>
  <text class="title" x="590" y="52" text-anchor="middle">流式输出链路：从模型 delta 到前端逐字展示</text>

  <rect class="box fe" x="65" y="170" width="170" height="90"/><text class="head" x="150" y="204" text-anchor="middle">Vue 前端</text><text class="small" x="150" y="228" text-anchor="middle">发起请求</text><text class="small" x="150" y="250" text-anchor="middle">逐字渲染</text>
  <rect class="box api" x="315" y="150" width="210" height="130"/><text class="head" x="420" y="184" text-anchor="middle">NestJS Stream</text><text class="small" x="360" y="216">建立 SSE</text><text class="small" x="360" y="242">转发 delta</text><text class="small" x="360" y="268">处理 abort</text>
  <rect class="box llm" x="620" y="170" width="180" height="90"/><text class="head" x="710" y="204" text-anchor="middle">LLM Provider</text><text class="small" x="710" y="228" text-anchor="middle">stream=true</text><text class="small" x="710" y="250" text-anchor="middle">delta chunks</text>
  <rect class="box log" x="890" y="150" width="210" height="130"/><text class="head" x="995" y="184" text-anchor="middle">最终落库</text><text class="small" x="935" y="216">完整 assistant 消息</text><text class="small" x="935" y="242">usage / cost</text><text class="small" x="935" y="268">finish reason</text>

  <line class="arrow" x1="235" y1="205" x2="312" y2="205"/>
  <line class="arrow" x1="525" y1="205" x2="617" y2="205"/>
  <path class="dash" d="M620 245 C520 335, 380 335, 315 245"/>
  <path class="dash" d="M315 235 C250 330, 145 325, 150 260"/>
  <line class="arrow" x1="800" y1="215" x2="887" y2="215"/>

  <rect class="box" x="235" y="365" width="710" height="78" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="head" x="590" y="397" text-anchor="middle">流式输出不只是 UI 效果</text>
  <text class="small" x="590" y="423" text-anchor="middle">还要处理断连、停止生成、部分输出、错误事件、最终完成事件和成本统计。</text>
</svg>
