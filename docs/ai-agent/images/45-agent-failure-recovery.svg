<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640" role="img" aria-labelledby="title desc">
  <title id="title">Agent 失败恢复</title>
  <desc id="desc">展示 Agent 工具调用失败后的错误分类、重试、降级、人工处理、回滚和任务状态更新流程。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#475569"/></marker>
    <style>.bg{fill:#f8fafc}.title{font:700 30px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#0f172a}.box{stroke-width:2;rx:14}.err{fill:#fef2f2;stroke:#ef4444}.dec{fill:#fff7ed;stroke:#f97316}.ok{fill:#ecfdf5;stroke:#10b981}.obs{fill:#f5f3ff;stroke:#8b5cf6}.head{font:700 17px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#0f172a}.small{font:14px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#334155}.arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect class="bg" width="1180" height="640"/><text class="title" x="590" y="52" text-anchor="middle">Agent 失败恢复：失败不是异常情况，而是常态</text>
  <rect class="box err" x="90" y="170" width="160" height="85"/><text class="head" x="170" y="203" text-anchor="middle">工具失败</text><text class="small" x="170" y="228" text-anchor="middle">timeout / 400 / 500</text>
  <rect class="box dec" x="330" y="170" width="170" height="85"/><text class="head" x="415" y="203" text-anchor="middle">错误分类</text><text class="small" x="415" y="228" text-anchor="middle">可恢复？不可恢复？</text>
  <rect class="box ok" x="580" y="110" width="170" height="85"/><text class="head" x="665" y="143" text-anchor="middle">可恢复</text><text class="small" x="665" y="168" text-anchor="middle">重试 / 降级</text>
  <rect class="box err" x="580" y="250" width="170" height="85"/><text class="head" x="665" y="283" text-anchor="middle">不可恢复</text><text class="small" x="665" y="308" text-anchor="middle">终止 / 人工处理</text>
  <rect class="box obs" x="830" y="170" width="180" height="85"/><text class="head" x="920" y="203" text-anchor="middle">更新状态</text><text class="small" x="920" y="228" text-anchor="middle">task / step / error</text>
  <rect class="box obs" x="440" y="450" width="300" height="80"/><text class="head" x="590" y="482" text-anchor="middle">记录 bad case</text><text class="small" x="590" y="507" text-anchor="middle">输入、工具、参数、错误、恢复结果</text>
  <line class="arrow" x1="250" y1="212" x2="327" y2="212"/><line class="arrow" x1="500" y1="195" x2="577" y2="155"/><line class="arrow" x1="500" y1="230" x2="577" y2="290"/><line class="arrow" x1="750" y1="155" x2="827" y2="200"/><line class="arrow" x1="750" y1="290" x2="827" y2="225"/><path class="arrow" d="M920 255 C840 400, 690 430, 620 447"/>
  <text class="small" x="590" y="590" text-anchor="middle">必须限制最大步骤数、最大重试次数、最大预算和最大运行时间。</text>
</svg>
