<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" role="img" aria-labelledby="title desc">
  <title id="title">Tool Calling 工具调用流程</title>
  <desc id="desc">模型提出工具调用请求，应用后端校验参数和权限后执行工具，再把工具结果交给模型生成最终回答。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #0f172a; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 14; }
      .blue { fill: #eff6ff; stroke: #3b82f6; }
      .green { fill: #ecfdf5; stroke: #10b981; }
      .orange { fill: #fff7ed; stroke: #f97316; }
      .head { font: 700 17px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #0f172a; }
      .small { font: 14px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #334155; }
      .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 6 6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1180" height="560"/>
  <text class="title" x="590" y="52" text-anchor="middle">Tool Calling：模型提议，程序执行</text>

  <rect class="box blue" x="55" y="200" width="150" height="80"/>
  <text class="head" x="130" y="232" text-anchor="middle">用户</text>
  <text class="small" x="130" y="256" text-anchor="middle">查订单 1001</text>

  <rect class="box green" x="270" y="140" width="210" height="200"/>
  <text class="head" x="375" y="172" text-anchor="middle">应用后端</text>
  <text class="small" x="310" y="205">提供工具列表</text>
  <text class="small" x="310" y="235">接收工具请求</text>
  <text class="small" x="310" y="265">校验参数和权限</text>
  <text class="small" x="310" y="295">执行工具并记录日志</text>

  <rect class="box orange" x="560" y="200" width="160" height="80"/>
  <text class="head" x="640" y="232" text-anchor="middle">LLM</text>
  <text class="small" x="640" y="256" text-anchor="middle">选择 query_order</text>

  <rect class="box blue" x="800" y="200" width="160" height="80"/>
  <text class="head" x="880" y="232" text-anchor="middle">工具/API</text>
  <text class="small" x="880" y="256" text-anchor="middle">数据库 / 业务系统</text>

  <rect class="box green" x="1010" y="200" width="130" height="80"/>
  <text class="head" x="1075" y="232" text-anchor="middle">最终回答</text>
  <text class="small" x="1075" y="256" text-anchor="middle">自然语言</text>

  <line class="arrow" x1="205" y1="240" x2="267" y2="240"/>
  <path class="arrow" d="M480 205 C505 185, 535 185, 557 215"/>
  <path class="dash" d="M720 240 C750 240, 765 240, 797 240"/>
  <path class="arrow" d="M800 280 C700 405, 470 405, 375 340"/>
  <path class="arrow" d="M480 290 C525 340, 595 340, 640 280"/>
  <line class="arrow" x1="720" y1="240" x2="1007" y2="240"/>

  <rect class="box" x="230" y="410" width="720" height="82"/>
  <text class="head" x="590" y="443" text-anchor="middle">安全边界</text>
  <text class="small" x="590" y="468" text-anchor="middle">模型只负责“要不要调用哪个工具、参数是什么”；鉴权、校验、执行、审计必须由程序负责。</text>
</svg>
