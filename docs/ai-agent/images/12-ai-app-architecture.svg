<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">AI 应用基本架构</title>
  <desc id="desc">展示 Vue 前端、NestJS 主后端、鉴权、数据库、队列、LLM Provider、Agent 编排、FastAPI AI 服务、向量数据库、工具和观测模块的关系。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #0f172a; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 14; }
      .frontend { fill: #eff6ff; stroke: #3b82f6; }
      .backend { fill: #ecfdf5; stroke: #10b981; }
      .data { fill: #fef3c7; stroke: #f59e0b; }
      .ai { fill: #f5f3ff; stroke: #8b5cf6; }
      .tool { fill: #fff7ed; stroke: #f97316; }
      .obs { fill: #fce7f3; stroke: #ec4899; }
      .head { font: 700 17px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #0f172a; }
      .small { font: 13px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #334155; }
      .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1280" height="820"/>
  <text class="title" x="640" y="52" text-anchor="middle">AI 应用基本架构</text>

  <rect class="box frontend" x="70" y="115" width="150" height="80"/>
  <text class="head" x="145" y="148" text-anchor="middle">用户</text>
  <text class="small" x="145" y="172" text-anchor="middle">提问 / 上传文件</text>

  <rect class="box frontend" x="300" y="115" width="170" height="80"/>
  <text class="head" x="385" y="148" text-anchor="middle">Vue 前端</text>
  <text class="small" x="385" y="172" text-anchor="middle">聊天 / 进度 / 引用</text>

  <rect class="box backend" x="560" y="100" width="210" height="110"/>
  <text class="head" x="665" y="140" text-anchor="middle">NestJS 主后端</text>
  <text class="small" x="665" y="165" text-anchor="middle">统一 API / 任务 / 会话</text>
  <text class="small" x="665" y="188" text-anchor="middle">业务规则与权限入口</text>

  <line class="arrow" x1="220" y1="155" x2="297" y2="155"/>
  <line class="arrow" x1="470" y1="155" x2="557" y2="155"/>

  <rect class="box backend" x="120" y="285" width="160" height="80"/>
  <text class="head" x="200" y="318" text-anchor="middle">鉴权和权限</text>
  <text class="small" x="200" y="342" text-anchor="middle">用户 / 文件范围</text>

  <rect class="box data" x="330" y="285" width="160" height="80"/>
  <text class="head" x="410" y="318" text-anchor="middle">PostgreSQL</text>
  <text class="small" x="410" y="342" text-anchor="middle">用户 / 会话 / 任务</text>

  <rect class="box data" x="540" y="285" width="160" height="80"/>
  <text class="head" x="620" y="318" text-anchor="middle">Redis / Queue</text>
  <text class="small" x="620" y="342" text-anchor="middle">异步任务 / 限流</text>

  <rect class="box ai" x="750" y="285" width="160" height="80"/>
  <text class="head" x="830" y="318" text-anchor="middle">LLM Provider</text>
  <text class="small" x="830" y="342" text-anchor="middle">多模型适配</text>

  <rect class="box ai" x="960" y="285" width="170" height="80"/>
  <text class="head" x="1045" y="318" text-anchor="middle">Agent / Workflow</text>
  <text class="small" x="1045" y="342" text-anchor="middle">编排工具和流程</text>

  <line class="arrow" x1="610" y1="210" x2="230" y2="282"/>
  <line class="arrow" x1="635" y1="210" x2="430" y2="282"/>
  <line class="arrow" x1="660" y1="210" x2="620" y2="282"/>
  <line class="arrow" x1="700" y1="210" x2="820" y2="282"/>
  <line class="arrow" x1="745" y1="210" x2="1030" y2="282"/>

  <rect class="box ai" x="430" y="485" width="210" height="95"/>
  <text class="head" x="535" y="520" text-anchor="middle">FastAPI AI 服务</text>
  <text class="small" x="535" y="545" text-anchor="middle">文档解析 / Embedding</text>
  <text class="small" x="535" y="568" text-anchor="middle">RAG 检索 / 评估</text>

  <rect class="box ai" x="170" y="640" width="150" height="70"/>
  <text class="head" x="245" y="670" text-anchor="middle">文档解析</text>
  <text class="small" x="245" y="693" text-anchor="middle">PDF / MD / TXT</text>

  <rect class="box ai" x="390" y="640" width="150" height="70"/>
  <text class="head" x="465" y="670" text-anchor="middle">Embedding</text>
  <text class="small" x="465" y="693" text-anchor="middle">文本转向量</text>

  <rect class="box data" x="610" y="640" width="170" height="70"/>
  <text class="head" x="695" y="670" text-anchor="middle">Vector DB</text>
  <text class="small" x="695" y="693" text-anchor="middle">pgvector / 向量库</text>

  <line class="arrow" x1="560" y1="365" x2="535" y2="482"/>
  <line class="arrow" x1="490" y1="580" x2="305" y2="637"/>
  <line class="arrow" x1="535" y1="580" x2="480" y2="637"/>
  <line class="arrow" x1="590" y1="580" x2="670" y2="637"/>

  <rect class="box tool" x="900" y="485" width="170" height="80"/>
  <text class="head" x="985" y="518" text-anchor="middle">Tools</text>
  <text class="small" x="985" y="542" text-anchor="middle">API / SQLite / 文件</text>

  <rect class="box tool" x="900" y="640" width="170" height="70"/>
  <text class="head" x="985" y="670" text-anchor="middle">外部系统</text>
  <text class="small" x="985" y="693" text-anchor="middle">MCP / 业务 API</text>

  <line class="arrow" x1="1045" y1="365" x2="1000" y2="482"/>
  <line class="arrow" x1="985" y1="565" x2="985" y2="637"/>

  <rect class="box obs" x="790" y="100" width="190" height="110"/>
  <text class="head" x="885" y="140" text-anchor="middle">日志 / Trace</text>
  <text class="small" x="885" y="165" text-anchor="middle">token / 耗时 / 错误</text>
  <text class="small" x="885" y="188" text-anchor="middle">工具调用审计</text>
  <line class="arrow" x1="770" y1="155" x2="787" y2="155"/>
</svg>
