<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="720" viewBox="0 0 1220 720" role="img" aria-labelledby="title desc">
  <title id="title">pgvector 表结构</title>
  <desc id="desc">展示 documents、chunks、rag_queries、rag_citations 等表结构以及 user_id、document_id、metadata 和 embedding 的关系。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#475569"/></marker>
    <style>.bg{fill:#f8fafc}.title{font:700 30px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#0f172a}.table{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:12}.headbar{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.head{font:700 16px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#0f172a}.field{font:13px Consolas,"Microsoft YaHei",monospace;fill:#334155}.arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}.note{font:14px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#334155}</style>
  </defs>
  <rect class="bg" width="1220" height="720"/><text class="title" x="610" y="52" text-anchor="middle">PostgreSQL + pgvector：业务数据和向量索引放在一起</text>
  <g transform="translate(80,120)"><rect class="table" width="230" height="180"/><rect class="headbar" width="230" height="38" rx="12"/><text class="head" x="115" y="25" text-anchor="middle">documents</text><text class="field" x="18" y="65">id</text><text class="field" x="18" y="90">user_id</text><text class="field" x="18" y="115">file_id</text><text class="field" x="18" y="140">title</text><text class="field" x="18" y="165">parse_status</text></g>
  <g transform="translate(430,120)"><rect class="table" width="260" height="230"/><rect class="headbar" width="260" height="38" rx="12"/><text class="head" x="130" y="25" text-anchor="middle">chunks</text><text class="field" x="18" y="65">id</text><text class="field" x="18" y="90">document_id</text><text class="field" x="18" y="115">user_id</text><text class="field" x="18" y="140">content</text><text class="field" x="18" y="165">embedding vector(1536)</text><text class="field" x="18" y="190">metadata jsonb</text><text class="field" x="18" y="215">chunk_index</text></g>
  <g transform="translate(820,120)"><rect class="table" width="250" height="180"/><rect class="headbar" width="250" height="38" rx="12"/><text class="head" x="125" y="25" text-anchor="middle">rag_queries</text><text class="field" x="18" y="65">id</text><text class="field" x="18" y="90">user_id</text><text class="field" x="18" y="115">question</text><text class="field" x="18" y="140">answer</text><text class="field" x="18" y="165">trace_id</text></g>
  <g transform="translate(820,420)"><rect class="table" width="250" height="160"/><rect class="headbar" width="250" height="38" rx="12"/><text class="head" x="125" y="25" text-anchor="middle">rag_citations</text><text class="field" x="18" y="65">id</text><text class="field" x="18" y="90">query_id</text><text class="field" x="18" y="115">chunk_id</text><text class="field" x="18" y="140">score / quote</text></g>
  <line class="arrow" x1="310" y1="210" x2="427" y2="210"/><line class="arrow" x1="690" y1="220" x2="817" y2="200"/><line class="arrow" x1="945" y1="300" x2="945" y2="417"/><path class="arrow" d="M820 500 C720 510, 690 385, 620 350"/>
  <text class="note" x="610" y="650" text-anchor="middle">关键：检索时必须带 user_id / 权限过滤；metadata 负责文件名、页码、标题路径、段落序号和来源追踪。</text>
</svg>
