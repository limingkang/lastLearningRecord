<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
  <title id="title">向量检索流程</title>
  <desc id="desc">用户问题生成向量，与文档 Chunk 向量库计算相似度，返回 TopK 片段并放入 Prompt。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #0f172a; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 14; }
      .blue { fill: #eff6ff; stroke: #3b82f6; }
      .green { fill: #ecfdf5; stroke: #10b981; }
      .purple { fill: #f5f3ff; stroke: #8b5cf6; }
      .head { font: 700 17px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #0f172a; }
      .small { font: 14px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #334155; }
      .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1100" height="460"/>
  <text class="title" x="550" y="52" text-anchor="middle">Embedding 和向量检索</text>

  <rect class="box blue" x="55" y="115" width="180" height="80"/>
  <text class="head" x="145" y="148" text-anchor="middle">用户问题</text>
  <text class="small" x="145" y="172" text-anchor="middle">如何报销打车费？</text>

  <rect class="box blue" x="300" y="115" width="190" height="80"/>
  <text class="head" x="395" y="148" text-anchor="middle">问题 Embedding</text>
  <text class="small" x="395" y="172" text-anchor="middle">[0.12, -0.31, ...]</text>

  <rect class="box green" x="300" y="265" width="190" height="80"/>
  <text class="head" x="395" y="298" text-anchor="middle">Chunk 向量库</text>
  <text class="small" x="395" y="322" text-anchor="middle">文档片段向量</text>

  <rect class="box purple" x="565" y="190" width="170" height="80"/>
  <text class="head" x="650" y="223" text-anchor="middle">计算相似度</text>
  <text class="small" x="650" y="247" text-anchor="middle">找语义最接近</text>

  <rect class="box purple" x="805" y="190" width="170" height="80"/>
  <text class="head" x="890" y="223" text-anchor="middle">TopK 片段</text>
  <text class="small" x="890" y="247" text-anchor="middle">返回相关资料</text>

  <rect class="box green" x="805" y="330" width="170" height="80"/>
  <text class="head" x="890" y="363" text-anchor="middle">放入 Prompt</text>
  <text class="small" x="890" y="387" text-anchor="middle">让 LLM 基于资料答</text>

  <line class="arrow" x1="235" y1="155" x2="297" y2="155"/>
  <line class="arrow" x1="490" y1="155" x2="562" y2="220"/>
  <line class="arrow" x1="490" y1="305" x2="562" y2="240"/>
  <line class="arrow" x1="735" y1="230" x2="802" y2="230"/>
  <line class="arrow" x1="890" y1="270" x2="890" y2="327"/>

  <text class="small" x="550" y="420" text-anchor="middle">注意：向量检索擅长语义相似，不等于万能精确查询；订单号、金额、日期常要结合关键词或数据库查询。</text>
</svg>
