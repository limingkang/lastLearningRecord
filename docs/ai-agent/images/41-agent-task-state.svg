<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" role="img" aria-labelledby="title desc">
  <title id="title">Agent 任务状态模型</title>
  <desc id="desc">展示 Agent 任务需要保存 task、steps、tool calls、intermediate results、approval、usage 和 error 等状态。</desc>
  <style>.bg{fill:#f8fafc}.title{font:700 30px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#0f172a}.table{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:12}.headbar{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.head{font:700 16px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#0f172a}.field{font:13px Consolas,"Microsoft YaHei",monospace;fill:#334155}.small{font:14px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#334155}</style>
  <rect class="bg" width="1180" height="720"/><text class="title" x="590" y="52" text-anchor="middle">Agent 任务状态：长任务必须可恢复、可审计</text>
  <g transform="translate(80,120)"><rect class="table" width="300" height="250"/><rect class="headbar" width="300" height="40" rx="12"/><text class="head" x="150" y="26" text-anchor="middle">agent_tasks</text><text class="field" x="24" y="70">id</text><text class="field" x="24" y="95">user_id</text><text class="field" x="24" y="120">goal</text><text class="field" x="24" y="145">status</text><text class="field" x="24" y="170">current_step</text><text class="field" x="24" y="195">final_result</text><text class="field" x="24" y="220">error_message</text></g>
  <g transform="translate(440,120)"><rect class="table" width="300" height="250"/><rect class="headbar" width="300" height="40" rx="12"/><text class="head" x="150" y="26" text-anchor="middle">agent_steps</text><text class="field" x="24" y="70">id</text><text class="field" x="24" y="95">task_id</text><text class="field" x="24" y="120">step_name</text><text class="field" x="24" y="145">status</text><text class="field" x="24" y="170">input / output</text><text class="field" x="24" y="195">started_at</text><text class="field" x="24" y="220">finished_at</text></g>
  <g transform="translate(800,120)"><rect class="table" width="300" height="250"/><rect class="headbar" width="300" height="40" rx="12"/><text class="head" x="150" y="26" text-anchor="middle">tool_calls</text><text class="field" x="24" y="70">id</text><text class="field" x="24" y="95">task_id / step_id</text><text class="field" x="24" y="120">tool_name</text><text class="field" x="24" y="145">args / result</text><text class="field" x="24" y="170">status / error</text><text class="field" x="24" y="195">approval_id</text><text class="field" x="24" y="220">trace_id</text></g>
  <g transform="translate(250,455)"><rect class="table" width="300" height="140"/><rect class="headbar" width="300" height="40" rx="12"/><text class="head" x="150" y="26" text-anchor="middle">approvals</text><text class="field" x="24" y="70">id / user_id</text><text class="field" x="24" y="95">action / status</text><text class="field" x="24" y="120">approved_at</text></g>
  <g transform="translate(630,455)"><rect class="table" width="300" height="140"/><rect class="headbar" width="300" height="40" rx="12"/><text class="head" x="150" y="26" text-anchor="middle">agent_usage</text><text class="field" x="24" y="70">task_id</text><text class="field" x="24" y="95">tokens / cost</text><text class="field" x="24" y="120">tool_count / latency</text></g>
  <text class="small" x="590" y="665" text-anchor="middle">没有状态表的 Agent 很难恢复、调试、评估，也不适合真实业务。</text>
</svg>
