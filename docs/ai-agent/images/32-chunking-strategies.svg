<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" role="img" aria-labelledby="title desc">
  <title id="title">文档切分策略</title>
  <desc id="desc">展示按标题、按段落、固定长度加 overlap 的文档切分策略，以及 chunk 太短、太长、重叠不足或过多的风险。</desc>
  <style>.bg{fill:#f8fafc}.title{font:700 30px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#0f172a}.box{stroke:#cbd5e1;stroke-width:2;rx:14;fill:#fff}.chunk{stroke-width:2;rx:10}.a{fill:#eff6ff;stroke:#3b82f6}.b{fill:#ecfdf5;stroke:#10b981}.c{fill:#fef3c7;stroke:#f59e0b}.d{fill:#fce7f3;stroke:#ec4899}.head{font:700 17px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#0f172a}.small{font:14px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#334155}</style>
  <rect class="bg" width="1180" height="720"/><text class="title" x="590" y="52" text-anchor="middle">Chunk 切分策略：检索质量从这里开始</text>
  <rect class="box" x="70" y="110" width="1040" height="120"/><text class="head" x="100" y="145">原始文档结构</text><rect class="chunk a" x="100" y="170" width="190" height="35"/><text class="small" x="195" y="193" text-anchor="middle">标题：报销制度</text><rect class="chunk b" x="310" y="170" width="250" height="35"/><text class="small" x="435" y="193" text-anchor="middle">段落：交通费规则...</text><rect class="chunk b" x="580" y="170" width="250" height="35"/><text class="small" x="705" y="193" text-anchor="middle">段落：住宿费规则...</text><rect class="chunk b" x="850" y="170" width="220" height="35"/><text class="small" x="960" y="193" text-anchor="middle">段落：审批流程...</text>
  <rect class="box" x="70" y="280" width="320" height="175"/><text class="head" x="230" y="315" text-anchor="middle">按标题切分</text><rect class="chunk a" x="110" y="345" width="240" height="38"/><text class="small" x="230" y="369" text-anchor="middle">报销制度 / 交通费</text><rect class="chunk a" x="110" y="395" width="240" height="38"/><text class="small" x="230" y="419" text-anchor="middle">报销制度 / 住宿费</text>
  <rect class="box" x="430" y="280" width="320" height="175"/><text class="head" x="590" y="315" text-anchor="middle">按段落切分</text><rect class="chunk b" x="470" y="345" width="240" height="38"/><text class="small" x="590" y="369" text-anchor="middle">段落 1</text><rect class="chunk b" x="470" y="395" width="240" height="38"/><text class="small" x="590" y="419" text-anchor="middle">段落 2</text>
  <rect class="box" x="790" y="280" width="320" height="175"/><text class="head" x="950" y="315" text-anchor="middle">固定长度 + overlap</text><rect class="chunk c" x="830" y="345" width="170" height="38"/><text class="small" x="915" y="369" text-anchor="middle">chunk A</text><rect class="chunk d" x="950" y="395" width="120" height="38"/><text class="small" x="1010" y="419" text-anchor="middle">重叠区</text>
  <rect class="box" x="150" y="535" width="880" height="95"/><text class="head" x="590" y="570" text-anchor="middle">切分平衡</text><text class="small" x="590" y="598" text-anchor="middle">太短：缺上下文；太长：检索不精准且成本高；overlap 太少：信息断裂；overlap 太多：重复和成本增加。</text>
</svg>
