<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="650" viewBox="0 0 1220 650" role="img" aria-labelledby="title desc">
  <title id="title">RAG 评估闭环</title>
  <desc id="desc">展示准备测试集、运行 RAG、评估召回、答案、引用和拒答，分析 bad case 并调整 chunk、topK、rerank 和 prompt 的闭环。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#475569"/></marker>
    <style>.bg{fill:#f8fafc}.title{font:700 30px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#0f172a}.box{stroke-width:2;rx:14}.a{fill:#eff6ff;stroke:#3b82f6}.b{fill:#ecfdf5;stroke:#10b981}.c{fill:#fef3c7;stroke:#f59e0b}.d{fill:#f5f3ff;stroke:#8b5cf6}.e{fill:#fff7ed;stroke:#f97316}.head{font:700 17px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#0f172a}.small{font:14px "Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#334155}.arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect class="bg" width="1220" height="650"/><text class="title" x="610" y="52" text-anchor="middle">RAG 评估闭环：不要凭感觉说效果好</text>
  <rect class="box a" x="80" y="160" width="180" height="90"/><text class="head" x="170" y="195" text-anchor="middle">测试集</text><text class="small" x="170" y="220" text-anchor="middle">问题 + 标准答案</text>
  <rect class="box b" x="340" y="160" width="180" height="90"/><text class="head" x="430" y="195" text-anchor="middle">运行 RAG</text><text class="small" x="430" y="220" text-anchor="middle">记录 chunks / answer</text>
  <rect class="box c" x="600" y="160" width="180" height="90"/><text class="head" x="690" y="195" text-anchor="middle">评估指标</text><text class="small" x="690" y="220" text-anchor="middle">召回 / 引用 / 拒答</text>
  <rect class="box d" x="860" y="160" width="180" height="90"/><text class="head" x="950" y="195" text-anchor="middle">Bad Case</text><text class="small" x="950" y="220" text-anchor="middle">定位失败原因</text>
  <rect class="box e" x="470" y="390" width="280" height="95"/><text class="head" x="610" y="425" text-anchor="middle">调整策略</text><text class="small" x="610" y="452" text-anchor="middle">chunk / topK / rerank / prompt / metadata</text>
  <line class="arrow" x1="260" y1="205" x2="337" y2="205"/><line class="arrow" x1="520" y1="205" x2="597" y2="205"/><line class="arrow" x1="780" y1="205" x2="857" y2="205"/><path class="arrow" d="M950 250 C900 360, 780 410, 750 430"/><path class="arrow" d="M470 430 C285 420, 175 315, 170 253"/>
  <rect class="box" x="230" y="555" width="760" height="60" fill="#fff" stroke="#cbd5e1"/><text class="small" x="610" y="591" text-anchor="middle">评估重点：检索是否命中、答案是否忠实、引用是否支持结论、没有资料时是否正确拒答。</text>
</svg>
